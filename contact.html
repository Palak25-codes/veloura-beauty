<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Veloura</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"></header>
<section>
  <h2>Contact us</h2>
  <div class="contact">
    <div>
      <p>Veloura Studio, 12 Fern Lane, Sector 62, Noida, Uttar Pradesh</p>
      <p>+91 XXXXXXXXXXX</p>
      <p>hello@veloura.in</p>
      <p>Monday to Saturday, 10 AM to 7 PM</p>
    </div>
    <form id="form">
      <input id="name" placeholder="Your name">
      <input id="email" placeholder="name@company.com">
      <textarea id="msg" rows="5" placeholder="How can we help?"></textarea>
      <button class="btn">Send message</button>
      <p id="note"></p>
    </form>
  </div>
</section>
<footer id="foot"></footer>
<script src="script.js"></script>
</body>
</html>
